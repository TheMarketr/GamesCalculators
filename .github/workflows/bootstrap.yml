name: Bootstrap GamesCalculators

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand validated source
        shell: bash
        run: |
          if [ ! -f GamesCalculators-phase3.tar.gz ]; then
            echo "Archive not present yet; waiting for upload."
            exit 0
          fi
          tar -xzf GamesCalculators-phase3.tar.gz
          rm -f GamesCalculators-phase3.tar.gz .github/workflows/bootstrap.yml
          git config user.name "TheMarketr"
          git config user.email "TheMarketr@users.noreply.github.com"
          git add -A
          git commit -m "Build GamesCalculators through phase 3"
          git push origin HEAD:main
