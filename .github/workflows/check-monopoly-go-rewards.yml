name: Check MONOPOLY GO reward links
on:
  # Cloudflare's reward-refresh Worker owns hourly live checks.
  # Keep this static snapshot maintenance workflow available only on demand.
  workflow_dispatch:
jobs:
  check:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/reward-maintenance.yml
    with:
      game: monopoly-go
